name: coverage

on:
  push:
    branches:
      - main

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage (Linux, GCC + gcov/lcov)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev catch2 ninja-build lcov

      - name: Configure
        run: |
          cmake -GNinja -S . -B .build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAUTODIFF_BUILD_PYTHON=OFF \
            -DAUTODIFF_BUILD_DOCS=OFF \
            -DAUTODIFF_TEST_COVERAGE=ON

      - name: Build
        run: cmake --build .build

      - name: Test
        run: cmake --build .build --target tests

      - name: Generate coverage report
        run: |
          lcov --capture --directory .build --output-file coverage.info --ignore-errors mismatch,gcov,negative
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/pybind11/*' --output-file coverage.info --ignore-errors unused
          lcov --list coverage.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
