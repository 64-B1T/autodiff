name: bazel

# Kept manually-triggerable but not run automatically: this job uses the same
# conda-devenv setup that was failing on linux/osx/website (conda reporting
# "invalid choice: 'devenv'" -- fixed below by installing conda-devenv into
# base explicitly). Re-enable the push/pull_request/schedule triggers once a
# manual run here confirms it works. Note there's no `disabled:` key in the
# GitHub Actions workflow schema -- setting one (as this file used to) makes
# the whole workflow file invalid, which is why this job never actually ran.
on:
  workflow_dispatch:

jobs:
  bazel:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest]
      fail-fast: true
      max-parallel: 4

    steps:
    - uses: actions/checkout@v4

    - uses: conda-incubator/setup-miniconda@v3
      with:
        mamba-version: "*"
        channels: conda-forge
        channel-priority: true
        activate-environment: autodiff
        auto-update-conda: true
        auto-activate-base: false
        show-channel-urls: true

    - name: Configure
      shell: bash -l {0}
      run: |
        conda config --set always_yes yes --set changeps1 no
        conda install -n base conda-devenv  # must land in base: conda plugin discovery only sees base's env
        conda install bazel
        conda devenv
        source activate autodiff

    - name: Build
      shell: bash -l {0}
      run: |
        bazel build //examples/forward:all
        bazel build //examples/reverse:all

    - name: Test
      shell: bash -l {0}
      run: |
        bazel test //examples/forward:all --test_output=all
        bazel test //examples/reverse:all --test_output=all
