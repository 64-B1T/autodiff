name: bazel

# Manual-trigger only until verified working (was silently invalid before via
# an unsupported `disabled:` key).
on:
  workflow_dispatch:

jobs:
  bazel:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest]
      fail-fast: true
      max-parallel: 4

    steps:
    - uses: actions/checkout@v4

    - uses: conda-incubator/setup-miniconda@v3
      with:
        mamba-version: "*"
        channels: conda-forge
        channel-priority: true
        activate-environment: autodiff
        auto-update-conda: true
        auto-activate-base: false
        show-channel-urls: true

    - name: Configure
      shell: bash -l {0}
      run: |
        conda config --set always_yes yes --set changeps1 no
        conda install conda-devenv bazel
        conda-devenv
        source activate autodiff

    - name: Build
      shell: bash -l {0}
      run: |
        bazel build //examples/forward:all
        bazel build //examples/reverse:all

    - name: Test
      shell: bash -l {0}
      run: |
        bazel test //examples/forward:all --test_output=all
        bazel test //examples/reverse:all --test_output=all
