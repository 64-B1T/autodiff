name: website

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 5 * * 1"  # runs at 05:00 UTC on Mondays

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true


      - name: Configuring Conda Environment
        shell: bash -el {0}
        run: |
          mamba install -n base conda-devenv  # must land in base: conda plugin discovery only sees base's env
          conda devenv -e mamba

      - name: Build Website
        shell: bash -l {0}
        run: |
          source activate autodiff
          cmake -S . -B .build
          cmake --build .build --target docs
      - name: Deploy Website
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.build/docs/site
          publish_branch: gh-pages
          commit_message: ${{ github.event.head_commit.message }}
